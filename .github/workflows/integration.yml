name: Run PHPUnit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: WP ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    env:
      WP_VERSION: ${{ matrix.wordpress }}
      # Without this, the tests run on the PHP version in .wp-env.json,
      # whatever the matrix says.
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    strategy:
      matrix:
        include:
          # Check lowest supported WP version, with the lowest supported PHP.
          - wordpress: '6.4'
            php: '7.4'
          # The WP version in the readme's "Tested up to", with the latest PHP.
          - wordpress: '7.1'
            php: '8.5'
          # Check latest WP with the latest PHP.
          - wordpress: 'master'
            php: '8.6'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: ${{ matrix.ini-values }}
          coverage: ${{ matrix.coverage }}
          tools: composer

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "${{ matrix.composer-options }}"

      - name: Setup wp-env
        run: npx --no wp-env start
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress == 'latest' && 'master' || matrix.wordpress }}

      - name: Run integration tests (single site)
        if: ${{ matrix.php != 8.5 }}
        run: composer test:integration
      - name: Run integration tests (single site with code coverage)
        if: ${{ matrix.php == 8.5 }}
        run: composer coverage-ci
      - name: Run integration tests (multisite)
        run: composer test:integration-ms
