name: Create GitHub Release

# Pushing the tag is the only release action. This workflow builds the ZIP and
# publishes the GitHub Release; deploy.yml runs off the same tag push. A tag
# containing a hyphen (1.14.0-rc.1) is published as a GitHub pre-release and is
# skipped by deploy.yml.
on:
  push:
    tags:
      - '*'

# Workflow-level permissions set to none; jobs declare their own minimal permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ZIP and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create the release and upload the ZIP

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu

          VERSION="${TAG#v}"

          HEADER="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' liveblog.php | head -n1 | tr -d '[:space:]')"
          CONSTANT="$(sed -n "s/.*const VERSION[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" liveblog.php | head -n1)"
          PACKAGE="$(jq -r .version package.json)"

          FAILED=0
          for pair in "plugin header:${HEADER}" "VERSION constant:${CONSTANT}" "package.json:${PACKAGE}"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} is '${pair#*:}' but the tag is '${VERSION}'"
              FAILED=1
            fi
          done

          # A ZIP whose internal version disagrees with its tag makes every
          # later "which build is this?" question unanswerable.
          [ "$FAILED" -eq 0 ]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # Disabled to prevent cache poisoning in release workflows
          package-manager-cache: false

      - name: Build assets
        run: |
          npm ci
          npm run build

          # A missing bundle ships a plugin whose editor or front end silently
          # never loads, so fail loudly here instead.
          for f in build/app.js build/app.asset.php build/app.css build/amp.css build/admin.js build/admin.asset.php build/admin.css; do
            if [ ! -s "$f" ]; then
              echo "::error::npm run build did not produce $f"
              exit 1
            fi
          done

      - name: Build the distributable ZIP
        run: |
          set -eu

          # Unversioned name, as in previous releases, so
          # releases/latest/download/liveblog.zip keeps working.
          SLUG='liveblog'

          # Staged outside the checkout so rsync does not copy the staging
          # directory into itself. The ZIP must contain a single top-level
          # liveblog/ directory, or WordPress unpacks the files loose into
          # wp-content/plugins/.
          mkdir -p "$RUNNER_TEMP/dist/$SLUG"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/dist/$SLUG/"

          ZIP_PATH="$RUNNER_TEMP/${SLUG}.zip"
          ( cd "$RUNNER_TEMP/dist" && zip -rq "$ZIP_PATH" "$SLUG" )

          echo "ZIP contents:"
          unzip -l "$ZIP_PATH"

          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"

      - name: Prepare release title and notes
        id: prep
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu

          VERSION="${TAG#v}"

          # "Liveblog 1.13.0": the plugin name gives the release context
          # wherever it surfaces (Slack, email) rather than a bare version.
          PLUGIN_NAME="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Plugin Name:[[:space:]]*//p' liveblog.php | head -n1 | sed 's/[[:space:]]*$//')"
          echo "title=${PLUGIN_NAME} ${VERSION}" >> "$GITHUB_OUTPUT"

          # A hyphen marks a pre-release: 1.14.0-rc.1.
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          # Notes are the CHANGELOG entry for this version. The
          # "## [x.y.z] - date" heading is dropped (the title says it already)
          # and "###" subsections are promoted so they render as top level.
          awk -v ver="$VERSION" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ ("^## \\[?" ver "(\\]|[[:space:]]|$)") { found = 1; next }
            found && /^## / { exit }
            # The link-reference definitions at the foot of the file follow the
            # last version section with no heading to stop on.
            found && /^\[[^]]+\]:[[:space:]]/ { exit }
            found { print }
          ' CHANGELOG.md | sed -E 's/^### /## /' > "$RUNNER_TEMP/notes.raw"

          # Trim leading and trailing blank lines.
          awk 'NF { seen = 1 } seen' "$RUNNER_TEMP/notes.raw" \
            | tac | awk 'NF { seen = 1 } seen' | tac > "$RUNNER_TEMP/notes.md"

          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG entry found for ${VERSION}; falling back to auto-generated notes."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.prep.outputs.title }}
          HAVE_NOTES: ${{ steps.prep.outputs.have_notes }}
          PRERELEASE: ${{ steps.prep.outputs.prerelease }}
        run: |
          set -eu

          # An array, not a string: the title contains a space and would
          # otherwise word-split into several arguments.
          args=( --title "$TITLE" )

          if [ "$HAVE_NOTES" = 'true' ]; then
            args+=( --notes-file "$RUNNER_TEMP/notes.md" )
          else
            args+=( --generate-notes )
          fi

          if [ "$PRERELEASE" = 'true' ]; then
            args+=( --prerelease )
          fi

          # This is the only place the ZIP is attached; deploy.yml does not
          # upload it. The gh CLI is preinstalled, so no third-party action.
          gh release create "$TAG" "$ZIP_PATH" "${args[@]}"
